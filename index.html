<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash_Lab Logbook</title>
<style>
:root{--navy:#132238;--ink:#1e293b;--muted:#64748b;--accent:#00b8d9;--paper:#f6f9fc;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,#132238,#203654);color:#fff;padding:42px 24px 36px;border-bottom:4px solid var(--accent)}
.wrap{max-width:920px;margin:auto}
h1{margin:0;font-size:32px;letter-spacing:.4px}.sub{margin-top:8px;color:#cbd5e1}
main{max-width:920px;margin:28px auto 60px;padding:0 20px}
.month{background:#fff;border:1px solid #dbe5ee;border-radius:14px;margin:0 0 22px;overflow:hidden;box-shadow:0 7px 22px rgba(15,35,55,.06)}
.month h2{margin:0;padding:15px 18px;background:#e8fafd;color:#0f3b4a;font-size:18px;border-left:5px solid var(--accent)}
.pdf-list{padding:8px 12px 12px}.pdf{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);padding:12px 10px;border-bottom:1px solid #edf2f7}
.pdf:last-child{border-bottom:0}.pdf:hover{background:#f7fcfd}.open{font-size:12px;color:#008eaa;font-weight:700}
.empty,.error{background:#fff;border:1px solid #dbe5ee;border-radius:12px;padding:24px;color:var(--muted)}
.error{color:#9b1c1c;border-color:#fecaca;background:#fff7f7}
.rev{font-size:11px;color:var(--muted);margin:0 0 14px 4px}
footer{max-width:920px;margin:0 auto 30px;padding:0 20px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Flash_Lab Logbook</h1><div class="sub">Public laboratory logbook</div></div></header>
<main id="content"><div class="empty">Loading current logbook…</div></main>
<footer>PDF links are pinned to the current Git commit to avoid stale cached revisions.</footer>
<script>
const owner='curcioa', repo='FLASH_LAB-Logbook', branch='main';
const monthNum={January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey=n=>{const m=n.match(/^([A-Za-z]+)(\d{4})$/);return m?[+m[2],monthNum[m[1]]||0]:[0,0]};
const dateKey=n=>{const m=n.match(/^Logbook(\d{2})(\d{2})(\d{4})\.pdf$/);return m?[+m[3],+m[2],+m[1]]:[0,0,0]};
const cmp=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]!==b[i])return b[i]-a[i]}return 0};
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function gh(path){const sep=path.includes('?')?'&':'?';const r=await fetch(`https://api.github.com/repos/${owner}/${repo}${path}${sep}_=${Date.now()}`,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`GitHub API ${r.status}`);return r.json()}
(async()=>{
  try{
    const commit=await gh(`/commits/${branch}`);
    const commitSha=commit.sha;
    const treeSha=commit.commit.tree.sha;
    const tree=await gh(`/git/trees/${treeSha}?recursive=1`);
    const pdfs=(tree.tree||[]).filter(x=>x.type==='blob'&&/^[A-Za-z]+\d{4}\/Logbook\d{8}\.pdf$/.test(x.path));
    const groups=new Map();
    for(const f of pdfs){const [month,name]=f.path.split('/');if(!groups.has(month))groups.set(month,[]);groups.get(month).push({name,path:f.path});}
    const months=[...groups.keys()].sort((a,b)=>cmp(monthKey(a),monthKey(b)));
    const sections=[];
    sections.push(`<div class="rev">Current repository revision: ${esc(commitSha.slice(0,10))}</div>`);
    for(const month of months){
      const files=groups.get(month).sort((a,b)=>cmp(dateKey(a.name),dateKey(b.name)));
      const links=files.map(f=>{
        const m=f.name.match(/^Logbook(\d{2})(\d{2})(\d{4})\.pdf$/); const label=m?`${m[1]}/${m[2]}/${m[3]}`:f.name;
        const href=`https://raw.githubusercontent.com/${owner}/${repo}/${commitSha}/${encPath(f.path)}`;
        return `<a class="pdf" href="${esc(href)}" target="_blank" rel="noopener"><span>${esc(label)}</span><span class="open">Open latest PDF ↗</span></a>`;
      }).join('');
      sections.push(`<section class="month"><h2>${esc(month)}</h2><div class="pdf-list">${links}</div></section>`);
    }
    document.getElementById('content').innerHTML=pdfs.length?sections.join(''):'<div class="empty">No public logbook PDFs yet.</div>';
  }catch(e){document.getElementById('content').innerHTML=`<div class="error">Could not load the current logbook. ${esc(e.message)}</div>`}
})();
</script>
</body>
</html>
