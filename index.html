<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash_Lab Logbook</title><style>
:root{--navy:#132238;--ink:#1e293b;--muted:#64748b;--accent:#00b8d9;--paper:#f6f9fc;--line:#dbe5ee}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#132238,#203654);color:#fff;padding:42px 24px 36px;border-bottom:4px solid var(--accent)}.wrap,main{max-width:920px;margin:auto}h1{margin:0;font-size:32px}.sub{margin-top:8px;color:#cbd5e1}main{padding:28px 20px 60px}.filters,.month,.empty,.error{background:#fff;border:1px solid var(--line);border-radius:14px}.filters{padding:16px;margin-bottom:22px;box-shadow:0 7px 22px #0f23370d}.grid{display:grid;grid-template-columns:minmax(220px,1fr) 160px 160px auto;gap:10px;align-items:end}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin:0 0 6px 2px;text-transform:uppercase}.field input{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 11px;font:inherit}.clear{height:40px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font-weight:800;padding:0 14px;cursor:pointer}.info{margin-top:10px;color:var(--muted);font-size:12px}.month{margin-bottom:22px;overflow:hidden}.month h2{margin:0;padding:15px 18px;background:#e8fafd;color:#0f3b4a;font-size:18px;border-left:5px solid var(--accent)}.list{padding:8px 12px 12px}.pdf{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);padding:12px 10px;border-bottom:1px solid #edf2f7}.pdf:last-child{border-bottom:0}.pdf:hover{background:#f7fcfd}.open{font-size:12px;color:#008eaa;font-weight:800}.empty,.error{padding:24px;color:var(--muted)}.error{color:#9b1c1c;border-color:#fecaca;background:#fff7f7}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}}@media(max-width:480px){.grid{grid-template-columns:1fr}.search{grid-column:auto}}
</style></head><body><header><div class="wrap"><h1>Flash_Lab Logbook</h1><div class="sub">Public laboratory logbook</div></div></header><main><section class="filters"><div class="grid"><div class="field search"><label for="q">Search</label><input id="q" type="search" placeholder="Keyword or phrase..."></div><div class="field"><label for="from">From</label><input id="from" type="date"></div><div class="field"><label for="to">To</label><input id="to" type="date"></div><button id="clear" class="clear">Clear</button></div><div id="info" class="info">Loading reports...</div></section><div id="content"><div class="empty">Loading logbook...</div></div></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const q=document.getElementById('q'),f=document.getElementById('from'),t=document.getElementById('to'),info=document.getElementById('info'),content=document.getElementById('content');let reports=[];
function render(){const terms=norm(q.value).trim().split(/\s+/).filter(Boolean),lo=f.value,hi=t.value;const rows=reports.filter(r=>{if(lo&&r.date<lo)return false;if(hi&&r.date>hi)return false;if(terms.length){const hay=norm(`${r.label} ${r.month} ${r.text||''}`);if(!terms.every(x=>hay.includes(x)))return false}return true});info.textContent=`${rows.length} report${rows.length===1?'':'s'}${(terms.length||lo||hi)?' found':''}`;if(!rows.length){content.innerHTML='<div class="empty">No reports match the current search/filter.</div>';return}const g=new Map();for(const r of rows){if(!g.has(r.month))g.set(r.month,[]);g.get(r.month).push(r)}const out=[];for(const [m,items] of g){const links=items.map(r=>{const u=`viewer.html?file=${encodeURIComponent(r.path)}&v=${encodeURIComponent(r.version||'')}`;return `<a class="pdf" href="${esc(u)}"><strong>${esc(r.label)}</strong><span class="open">Read report &rarr;</span></a>`}).join('');out.push(`<section class="month"><h2>${esc(m)}</h2><div class="list">${links}</div></section>`)}content.innerHTML=out.join('')}
[q,f,t].forEach(x=>x.addEventListener('input',render));document.getElementById('clear').addEventListener('click',()=>{q.value='';f.value='';t.value='';render();q.focus()});(async()=>{try{const r=await fetch(`search-index.json?_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();reports=Array.isArray(d.reports)?d.reports:[];render()}catch(e){info.textContent='';content.innerHTML=`<div class="error">Could not load the logbook index. ${esc(e.message)}</div>`}})();
</script></body></html>
