<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash_Lab Report</title><style>
html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef3f7}.bar{height:68px;background:#132238;color:white;border-bottom:4px solid #00b8d9;display:flex;align-items:center;gap:14px;padding:0 18px}.bar a{color:white;text-decoration:none;border:1px solid #ffffff44;border-radius:7px;padding:8px 11px;font-weight:700}.title{flex:1}.title b{display:block}.title span{font-size:12px;color:#cbd5e1}iframe{width:100%;height:calc(100vh - 68px);border:0}.err{margin:30px;padding:20px;background:white;color:#991b1b;border:1px solid #fecaca;border-radius:10px}
</style></head><body><div class="bar"><a href="./">&larr; Logbook</a><div class="title"><b id="t">Flash_Lab Report</b><span id="p"></span></div><a id="o" href="#" target="_blank">Open PDF &nearr;</a></div><iframe id="f"></iframe><script>
const q=new URLSearchParams(location.search),file=q.get('file')||'',v=q.get('v')||'';const ok=/^[A-Za-z]+\d{4}\/Logbook\d{8}\.pdf$/.test(file);const enc=p=>p.split('/').map(encodeURIComponent).join('/');if(!ok){document.getElementById('f').remove();let d=document.createElement('div');d.className='err';d.textContent='Invalid report path.';document.body.appendChild(d)}else{let u=enc(file)+(v?'?v='+encodeURIComponent(v):'');let m=file.match(/Logbook(\d{2})(\d{2})(\d{4})\.pdf$/),lab=m?`${m[1]}/${m[2]}/${m[3]}`:file;document.getElementById('t').textContent='Report '+lab;document.getElementById('p').textContent=file;document.getElementById('f').src=u;document.getElementById('o').href=u;document.title='Flash_Lab Logbook - '+lab}
</script></body></html>
